<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>TV screen | Geckoboard Engine</title>
  <link rel="stylesheet" href="/static/tv.css">
</head>
<body>
  <main id="tv-screen" data-rotation="__PUBLIC_ID__">
    <header class="tv-top"><div class="tv-brand"><span class="tv-mark">G</span><span>GECKOBOARD <b>LIVE</b></span></div><div class="tv-meta"><span id="screen-name">Loading screen loop</span><span id="screen-counter">-- / --</span><span class="live-indicator">LIVE</span></div></header>
    <section id="dashboard-host" class="dashboard-host"><div class="loading">Connecting to the dashboard...</div></section>
    <footer class="tv-footer"><span>GECKOBOARD ENGINE</span><span id="last-updated">Waiting for data</span></footer>
  </main>
  <script src="/static/tv.js" defer></script>
</body>
</html>
