<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead Engine</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="login" class="login-screen" hidden>
    <form id="login-form" class="login-card">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2 3 6.5v11L12 22l9-4.5v-11L12 2zm0 2.3 6.4 3.2L12 10.7 5.6 7.5 12 4.3zM5 9.2l6 3v7.6l-6-3V9.2zm8 10.6v-7.6l6-3v7.6l-6 3z"/></svg>
      </div>
      <h1>Lead Engine</h1>
      <p class="muted">Sign in to your workspace.</p>
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" autocomplete="username" value="admin@leadengine.local" required>
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" value="leadengine123" required>
      <button type="submit" class="btn primary" id="login-submit">Sign in</button>
      <p class="hint">admin@leadengine.local / leadengine123</p>
      <p id="login-error" class="form-error" role="alert"></p>
    </form>
  </div>

  <div id="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2 3 6.5v11L12 22l9-4.5v-11L12 2zm0 2.3 6.4 3.2L12 10.7 5.6 7.5 12 4.3zM5 9.2l6 3v7.6l-6-3V9.2zm8 10.6v-7.6l6-3v7.6l-6 3z"/></svg>
        </span>
        <span>Lead Engine</span>
      </div>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg><span>Dashboard</span></a>
        <a href="#/prospector" data-route="prospector"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.94 12.03l4.26 4.27-1.41 1.41-4.27-4.26A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg><span>Prospector</span></a>
        <a href="#/lists" data-route="lists"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h10v2H4v-2z"/></svg><span>Lists</span></a>
        <a href="#/enrich" data-route="enrich"><svg viewBox="0 0 24 24"><path d="M12 2 9 9H2l6 4.5L5.5 21 12 16.5 18.5 21 16 13.5 22 9h-7L12 2z"/></svg><span>Enrich</span></a>
        <a href="#/verifier" data-route="verifier"><svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z"/></svg><span>Verifier</span></a>
        <a href="#/campaigns" data-route="campaigns"><svg viewBox="0 0 24 24"><path d="M3 11v2l9 4 9-4v-2l-9 4-9-4zm0-5 9 4 9-4-9-4-9 4zm0 12 9 4 9-4-1.2-.5L12 20.2 4.2 17.5 3 18z"/></svg><span>Campaigns</span></a>
        <a href="#/api" data-route="api"><svg viewBox="0 0 24 24"><path d="M8.5 16.5 4 12l4.5-4.5 1.4 1.4L6.8 12l3.1 3.1-1.4 1.4zm7-9L20 12l-4.5 4.5-1.4-1.4 3.1-3.1-3.1-3.1L15.5 7.5z"/></svg><span>API &amp; MCP</span></a>
        <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.8 7.8 0 0 0 .1-1 7.8 7.8 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.3 2.4a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.8 7.8 0 0 0-.1 1 7.8 7.8 0 0 0 .1 1l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.3-2.4a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z"/></svg><span>Settings</span></a>
      </nav>
      <div class="credits-widget" id="credits-widget">
        <div class="credits-row"><span>Credits</span><strong id="side-credits">--</strong></div>
        <div class="credits-row"><span>Verifier</span><strong id="side-verifier">--</strong></div>
        <div class="bar"><span id="side-bar"></span></div>
        <div class="credits-plan" id="side-plan">--</div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button type="button" class="icon-btn" id="nav-toggle" aria-label="Toggle navigation">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
        </button>
        <h2 id="page-title">Dashboard</h2>
        <div class="topbar-user" id="topbar-user"></div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
