[project]
name = "lead-engine"
version = "0.1.0"
description = "Self-hosted B2B contact enrichment engine: LinkedIn URL to verified work email, direct email and phone"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.32",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    "dnspython>=2.6.1",
    "apscheduler>=3.10.4",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
]
